<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFL DraftKings SD Lineup Database</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .table-container {
            max-height: 600px;
            overflow: auto;
            position: relative;
        }
        
        table {
            border-collapse: separate;
            border-spacing: 0;
        }
        
        thead th {
            position: sticky;
            top: 0;
            z-index: 20;
            background-color: #000000;
        }
        
        tbody td:first-child,
        thead th:first-child {
            position: sticky;
            left: 0;
            z-index: 10;
            background-color: white;
        }
        
        thead th:first-child {
            z-index: 30;
            background-color: #000000;
        }
        
        tbody tr:hover td:first-child {
            background-color: #f9fafb;
        }
        
        tbody td:first-child {
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
        }
        
        thead th:first-child {
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
        }

        /* Analytics Section Styles */
        .analytics-section {
            transition: all 0.3s ease;
        }

        .analytics-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .analytics-content.expanded {
            max-height: 1200px;
            overflow-y: auto;
        }

        .analytics-inner {
            padding-bottom: 20px;
        }

        .toggle-icon {
            transition: transform 0.3s;
        }

        .toggle-icon.expanded {
            transform: rotate(180deg);
        }

        .stat-card {
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            padding: 16px;
        }

        .roster-bar {
            height: 8px;
            background: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 6px;
        }

        .roster-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #51ac53, #449947);
            transition: width 0.5s ease;
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="app" class="min-h-screen p-4">
        <div class="max-w-7xl mx-auto">
            <div class="bg-white rounded-lg shadow-md p-6 mb-6" style="border-top: 4px solid #51ac53;">
                <h1 class="text-3xl font-bold mb-2" style="color: #000000;">NFL DraftKings SD Lineup Database</h1>
                <p class="text-gray-600 mb-6" id="status">Loading data...</p>

                <div class="relative mb-4" id="searchContainer" style="display:none;">
                    <input type="text" id="searchInput" placeholder="Search lineups, players, games..." 
                           class="w-full pl-4 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:outline-none"
                           style="border-color: #51ac53;">
                </div>

                <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4" id="filterContainer" style="display:none;">
                    <select id="weekFilter" class="px-3 py-2 border rounded-lg focus:ring-2 focus:outline-none" style="border-color: #51ac53;">
                        <option value="">All Weeks</option>
                    </select>

                    <select id="gameFilter" class="px-3 py-2 border rounded-lg focus:ring-2 focus:outline-none" style="border-color: #51ac53;">
                        <option value="">All Games</option>
                    </select>

                    <select id="percentileFilter" class="px-3 py-2 border rounded-lg focus:ring-2 focus:outline-none" style="border-color: #51ac53;">
                        <option value="">All Percentiles</option>
                        <option value="99.9">≥ 99.9%</option>
                        <option value="99.0">≥ 99.0%</option>
                        <option value="90.0">≥ 90.0%</option>
                        <option value="50.0">≥ 50.0%</option>
                    </select>

                    <select id="duplicatesFilter" class="px-3 py-2 border rounded-lg focus:ring-2 focus:outline-none" style="border-color: #51ac53;">
                        <option value="">All Duplicates</option>
                        <option value="1">= 1</option>
                        <option value="5">≤ 5</option>
                        <option value="10">≤ 10</option>
                        <option value="25">≤ 25</option>
                        <option value="50">≤ 50</option>
                        <option value="50+">50+</option>
                        <option value="100+">100+</option>
                    </select>

                    <select id="rosterFilter" class="px-3 py-2 border rounded-lg focus:ring-2 focus:outline-none" style="border-color: #51ac53;">
                        <option value="">All Roster Constructions</option>
                    </select>

                    <select id="cptFilter" class="px-3 py-2 border rounded-lg focus:ring-2 focus:outline-none" style="border-color: #51ac53;">
                        <option value="">All CPT Positions</option>
                    </select>

                    <select id="spreadFilter" class="px-3 py-2 border rounded-lg focus:ring-2 focus:outline-none" style="border-color: #51ac53;">
                        <option value="">All Spreads</option>
                        <option value="<=3">≤ 3 (Close game)</option>
                        <option value="<=6.5">≤ 6.5 (Competitive)</option>
                        <option value=">=7">≥ 7 (Blowout)</option>
                    </select>

                    <select id="totalFilter" class="px-3 py-2 border rounded-lg focus:ring-2 focus:outline-none" style="border-color: #51ac53;">
                        <option value="">All Totals</option>
                        <option value="<=42">≤ 42 (Low scoring)</option>
                        <option value="42.5-47.5">42.5 - 47.5 (Average)</option>
                        <option value=">=48">≥ 48 (High scoring)</option>
                    </select>

                    <select id="marginFilter" class="px-3 py-2 border rounded-lg focus:ring-2 focus:outline-none" style="border-color: #51ac53;">
                        <option value="">All Margins of Victory</option>
                        <option value="<=3">≤ 3 (Close game)</option>
                        <option value="<=7">≤ 7 (One score)</option>
                        <option value="<=14">≤ 14 (Two scores)</option>
                        <option value=">=15">≥ 15 (Blowout)</option>
                    </select>

                    <button id="clearBtn" class="px-4 py-2 text-white rounded-lg transition font-semibold col-span-2 md:col-span-2" style="background-color: #51ac53;">
                        Clear All
                    </button>
                </div>

                <div id="resultCount" class="text-center font-semibold mb-4" style="color: #000000;"></div>
            </div>

            <!-- Analytics Section -->
            <div class="bg-white rounded-lg shadow-md mb-6 analytics-section" id="analyticsSection" style="display:none; border-left: 4px solid #51ac53;">
                <div class="p-4 bg-gray-50 cursor-pointer flex justify-between items-center hover:bg-gray-100 transition" onclick="toggleAnalytics()">
                    <h3 class="text-lg font-bold flex items-center gap-2" style="color: #000000;">
                        <span>📊</span>
                        <span>Filtered Results Analytics</span>
                    </h3>
                    <span class="toggle-icon text-xl">▼</span>
                </div>
                
                <div class="analytics-content" id="analyticsContent">
                    <div class="p-6">
                        <div class="text-center mb-6">
                            <button id="analyzeBtn" class="px-8 py-3 text-white rounded-lg font-semibold transition shadow-md hover:shadow-lg" 
                                    style="background: linear-gradient(135deg, #51ac53 0%, #449947 100%);"
                                    onmouseover="this.style.transform='translateY(-2px)'" 
                                    onmouseout="this.style.transform='translateY(0)'"
                                    onclick="analyzeFiltered()">
                                Analyze Filtered Results
                            </button>
                        </div>

                        <div id="analyticsResults" style="display:none;">
                            <div class="bg-blue-50 border border-blue-200 rounded-lg p-3 mb-6 text-center">
                                <p class="font-semibold text-blue-800" id="sampleSize"></p>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <!-- Roster Construction Breakdown -->
                                <div class="stat-card">
                                    <h4 class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-4">Roster Construction Breakdown</h4>
                                    <div id="rosterBreakdown" class="space-y-3"></div>
                                </div>

                                <!-- Average CPT Position -->
                                <div class="stat-card">
                                    <h4 class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-4">Captain Position Distribution</h4>
                                    <div id="cptBreakdown" class="space-y-3"></div>
                                </div>

                                <!-- Average Salary Used -->
                                <div class="stat-card">
                                    <h4 class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-4">Average Salary Used</h4>
                                    <div class="text-4xl font-bold" style="color: #000000;" id="avgSalary">-</div>
                                </div>

                                <!-- Average Position Count -->
                                <div class="stat-card">
                                    <h4 class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-4">Average Position Count</h4>
                                    <div id="positionOwnership" class="grid grid-cols-2 gap-3"></div>
                                </div>

                                <!-- Average Cumulative Ownership -->
                                <div class="stat-card">
                                    <h4 class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-4">Average Cumulative Ownership</h4>
                                    <div class="text-4xl font-bold" style="color: #000000;" id="avgOwnership">-</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <div class="table-container">
                    <table class="w-full">
                        <thead class="text-white" style="background-color: #000000;">
                            <tr id="tableHeader"></tr>
                        </thead>
                        <tbody id="tableBody" class="divide-y divide-gray-200"></tbody>
                    </table>
                </div>
                <div id="noResults" class="hidden text-center py-12 text-gray-500">
                    <p class="text-lg font-semibold">No results found</p>
                    <p class="text-sm">Try adjusting your filters or search term</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allData = [];
        let columns = [];
        let filteredData = [];
        let sortConfig = { key: null, direction: 'asc' };

        function parseCSV(text) {
            // Simple CSV parser that handles quoted fields
            const lines = text.split('\n');
            const headers = [];
            const data = [];
            
            // Parse header row
            const headerLine = lines[0];
            let currentField = '';
            let inQuotes = false;
            
            for (let i = 0; i < headerLine.length; i++) {
                const char = headerLine[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    headers.push(currentField.trim());
                    currentField = '';
                } else {
                    currentField += char;
                }
            }
            headers.push(currentField.trim());
            
            // Parse data rows
            for (let lineIdx = 1; lineIdx < lines.length; lineIdx++) {
                if (!lines[lineIdx].trim()) continue;
                
                const values = [];
                currentField = '';
                inQuotes = false;
                
                for (let i = 0; i < lines[lineIdx].length; i++) {
                    const char = lines[lineIdx][i];
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        values.push(currentField.trim());
                        currentField = '';
                    } else {
                        currentField += char;
                    }
                }
                values.push(currentField.trim());
                
                const row = {};
                headers.forEach((header, index) => {
                    let value = values[index] || '';
                    const numValue = parseFloat(value);
                    row[header] = !isNaN(numValue) && value !== '' && !value.includes('&') ? numValue : value;
                });
                
                data.push(row);
            }
            
            return { headers, data };
        }

        function cleanColumnName(columnName) {
            return columnName.replace(/_/g, ' ');
        }

        function formatValue(value, columnName) {
            if (value === null || value === undefined || value === '') return '';
            
            // Format Lineup Rank - remove decimals
            if (columnName === 'Lineup Rank') {
                return Math.floor(Number(value)).toLocaleString('en-US');
            }
            
            // Format Duplicates - remove decimals
            if (columnName === 'Duplicates') {
                return Math.floor(Number(value)).toLocaleString('en-US');
            }
            
            // Format Total_Lineups - remove decimals and add commas
            if (columnName === 'Total_Lineups') {
                return Math.floor(Number(value)).toLocaleString('en-US');
            }
            
            // Format Percentile_Finish as percentage with 2 decimals
            if (columnName === 'Percentile_Finish') {
                return (Number(value) * 100).toFixed(2) + '%';
            }
            
            // Format Week, Spread, Total, Game_Total, Margin - show only significant decimals
            if (columnName === 'Week' || columnName === 'Spread' || columnName === 'Total' || 
                columnName === 'Game_Total' || columnName === 'Margin') {
                const num = Number(value);
                return num % 1 === 0 ? Math.floor(num).toString() : num.toString();
            }
            
            // Format all Count_ columns as whole numbers
            if (columnName.startsWith('Count_')) {
                return Math.floor(Number(value)).toString();
            }
            
            // Format Product_Ownership - show actual small percentage with more precision
            if (columnName === 'Product_Ownership') {
                const percentage = Number(value) * 100;
                if (percentage < 0.01) {
                    return percentage.toFixed(6) + '%';
                }
                return percentage.toFixed(4) + '%';
            }
            
            // Format Roster_Construction - display as-is (already text like "2 & 4")
            if (columnName === 'Roster_Construction') {
                return value;
            }
            
            // Format Game column - change DAL_PHI to DAL @ PHI
            if (columnName === 'Game') {
                return String(value).replace(/_/g, ' @ ');
            }
            
            // Format salary columns as currency
            if (columnName.includes('Salary') || columnName.includes('CPTSalary')) {
                return '$' + Number(value).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
            }
            
            // Format ownership columns as percentage
            if (columnName.includes('Own') || columnName.includes('Ownership')) {
                return (Number(value) * 100).toFixed(1) + '%';
            }
            
            // Format numeric values
            if (typeof value === 'number') {
                return value.toFixed(2);
            }
            
            return value;
        }

        async function loadData() {
            try {
                console.log('Starting to load data...');
                document.getElementById('status').textContent = 'Loading lineup data from GitHub...';
                
                const response = await fetch('https://raw.githubusercontent.com/cmain101/Showdown-Data/main/test_sd_lineups2.csv');
                
                console.log('Fetch response status:', response.status);
                
                if (!response.ok) {
                    throw new Error('Failed to load CSV file: ' + response.status);
                }
                
                const csvText = await response.text();
                console.log('CSV loaded, length:', csvText.length);
                
                const parsed = parseCSV(csvText);
                console.log('Parse complete!');
                console.log('Total rows:', parsed.data.length);
                console.log('Headers:', parsed.headers);
                console.log('First row:', parsed.data[0]);
                
                allData = parsed.data;
                columns = parsed.headers;
                
                if (allData.length > 0) {
                    console.log('Initializing UI with', allData.length, 'rows');
                    initializeUI();
                    populateFilters();
                    renderTable();
                    document.getElementById('status').textContent = 
                        'Search and filter through ' + allData.length.toLocaleString() + ' lineup entries';
                    
                    // Show analytics section after data loads
                    document.getElementById('analyticsSection').style.display = 'block';
                } else {
                    document.getElementById('status').textContent = 'No data found in CSV';
                }
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('status').textContent = 'Error loading data: ' + error.message;
            }
        }

        function initializeUI() {
            console.log('Initializing UI...');
            document.getElementById('searchContainer').style.display = 'block';
            document.getElementById('filterContainer').style.display = 'grid';
            
            const headerRow = document.getElementById('tableHeader');
            headerRow.innerHTML = columns.map(col => 
                '<th onclick="sortTable(\'' + col.replace(/'/g, "\\'") + '\')" class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider cursor-pointer whitespace-nowrap" style="transition: background-color 0.2s;" onmouseover="this.style.backgroundColor=\'#51ac53\'" onmouseout="this.style.backgroundColor=\'#000000\'">' + 
                cleanColumnName(col) + ' ↕</th>'
            ).join('');

            document.getElementById('searchInput').addEventListener('input', renderTable);
            document.getElementById('weekFilter').addEventListener('change', renderTable);
            document.getElementById('gameFilter').addEventListener('change', renderTable);
            document.getElementById('percentileFilter').addEventListener('change', renderTable);
            document.getElementById('duplicatesFilter').addEventListener('change', renderTable);
            document.getElementById('rosterFilter').addEventListener('change', renderTable);
            document.getElementById('cptFilter').addEventListener('change', renderTable);
            document.getElementById('spreadFilter').addEventListener('change', renderTable);
            document.getElementById('totalFilter').addEventListener('change', renderTable);
            document.getElementById('marginFilter').addEventListener('change', renderTable);
            document.getElementById('clearBtn').addEventListener('click', clearFilters);
            
            const clearBtn = document.getElementById('clearBtn');
            clearBtn.addEventListener('mouseenter', function() {
                this.style.backgroundColor = '#449947';
            });
            clearBtn.addEventListener('mouseleave', function() {
                this.style.backgroundColor = '#51ac53';
            });
        }

        function populateFilters() {
            console.log('Populating filters...');
            
            const weeks = [...new Set(allData.map(r => r['Week']).filter(Boolean))].sort();
            const games = [...new Set(allData.map(r => r['Game']).filter(Boolean))].sort();
            const rosters = [...new Set(allData.map(r => r['Roster_Construction']).filter(Boolean))].sort();
            const cptPositions = [...new Set(allData.map(r => r['CPT_Position_Vegas']).filter(Boolean))].sort();

            console.log('Unique weeks:', weeks.length);
            console.log('Unique games:', games.length);
            console.log('Unique rosters:', rosters.length);
            console.log('Unique CPT positions:', cptPositions.length);

            document.getElementById('weekFilter').innerHTML = '<option value="">All Weeks</option>' +
                weeks.map(w => '<option value="' + w + '">' + w + '</option>').join('');
            
            document.getElementById('gameFilter').innerHTML = '<option value="">All Games</option>' +
                games.map(g => '<option value="' + g + '">' + g.replace(/_/g, ' @ ') + '</option>').join('');
            
            document.getElementById('rosterFilter').innerHTML = '<option value="">All Roster Constructions</option>' +
                rosters.map(r => '<option value="' + r + '">' + r + '</option>').join('');
            
            document.getElementById('cptFilter').innerHTML = '<option value="">All CPT Positions</option>' +
                cptPositions.map(c => '<option value="' + c + '">' + c + '</option>').join('');
        }

        function getFilteredData() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const weekFilter = document.getElementById('weekFilter').value;
            const gameFilter = document.getElementById('gameFilter').value;
            const percentileFilter = document.getElementById('percentileFilter').value;
            const duplicatesFilter = document.getElementById('duplicatesFilter').value;
            const rosterFilter = document.getElementById('rosterFilter').value;
            const cptFilter = document.getElementById('cptFilter').value;
            const spreadFilter = document.getElementById('spreadFilter').value;
            const totalFilter = document.getElementById('totalFilter').value;
            const marginFilter = document.getElementById('marginFilter').value;

            return allData.filter(row => {
                const matchesSearch = !search || Object.values(row).some(val =>
                    String(val).toLowerCase().includes(search)
                );
                
                const matchesWeek = !weekFilter || String(row['Week']) === weekFilter;
                const matchesGame = !gameFilter || String(row['Game']) === gameFilter;
                
                // Filter by percentile finish
                let matchesPercentile = true;
                if (percentileFilter) {
                    const percentile = Number(row['Percentile_Finish']) * 100; // Convert to percentage
                    matchesPercentile = percentile >= Number(percentileFilter);
                }
                
                // Filter by duplicates range
                let matchesDuplicates = true;
                if (duplicatesFilter) {
                    const duplicates = Number(row['Duplicates']);
                    if (duplicatesFilter === '1') {
                        matchesDuplicates = duplicates === 1;
                    } else if (duplicatesFilter === '5') {
                        matchesDuplicates = duplicates <= 5;
                    } else if (duplicatesFilter === '10') {
                        matchesDuplicates = duplicates <= 10;
                    } else if (duplicatesFilter === '25') {
                        matchesDuplicates = duplicates <= 25;
                    } else if (duplicatesFilter === '50') {
                        matchesDuplicates = duplicates <= 50;
                    } else if (duplicatesFilter === '50+') {
                        matchesDuplicates = duplicates > 50;
                    } else if (duplicatesFilter === '100+') {
                        matchesDuplicates = duplicates > 100;
                    }
                }
                
                const matchesRoster = !rosterFilter || String(row['Roster_Construction']) === rosterFilter;
                const matchesCPT = !cptFilter || String(row['CPT_Position_Vegas']) === cptFilter;
                
                // Filter by spread
                let matchesSpread = true;
                if (spreadFilter) {
                    const spread = Math.abs(Number(row['Spread']) || 0); // Use absolute value for spread
                    if (spreadFilter === '<=3') {
                        matchesSpread = spread <= 3;
                    } else if (spreadFilter === '<=6.5') {
                        matchesSpread = spread <= 6.5;
                    } else if (spreadFilter === '>=7') {
                        matchesSpread = spread >= 7;
                    }
                }
                
                // Filter by total
                let matchesTotal = true;
                if (totalFilter) {
                    const total = Number(row['Total']) || 0;
                    if (totalFilter === '<=42') {
                        matchesTotal = total <= 42;
                    } else if (totalFilter === '42.5-47.5') {
                        matchesTotal = total >= 42.5 && total <= 47.5;
                    } else if (totalFilter === '>=48') {
                        matchesTotal = total >= 48;
                    }
                }
                
                // Filter by margin of victory
                let matchesMargin = true;
                if (marginFilter) {
                    const margin = Math.abs(Number(row['Margin']) || 0); // Use absolute value for margin
                    if (marginFilter === '<=3') {
                        matchesMargin = margin <= 3;
                    } else if (marginFilter === '<=7') {
                        matchesMargin = margin <= 7;
                    } else if (marginFilter === '<=14') {
                        matchesMargin = margin <= 14;
                    } else if (marginFilter === '>=15') {
                        matchesMargin = margin >= 15;
                    }
                }

                return matchesSearch && matchesWeek && matchesGame && matchesPercentile && 
                       matchesDuplicates && matchesRoster && matchesCPT && matchesSpread && 
                       matchesTotal && matchesMargin;
            });
        }

        function sortTable(key) {
            if (sortConfig.key === key) {
                sortConfig.direction = sortConfig.direction === 'asc' ? 'desc' : 'asc';
            } else {
                sortConfig.key = key;
                sortConfig.direction = 'asc';
            }
            renderTable();
        }

        function renderTable() {
            console.log('Rendering table...');
            filteredData = getFilteredData();

            if (sortConfig.key) {
                filteredData.sort((a, b) => {
                    const aVal = a[sortConfig.key];
                    const bVal = b[sortConfig.key];
                    
                    if (typeof aVal === 'number' && typeof bVal === 'number') {
                        return sortConfig.direction === 'asc' ? aVal - bVal : bVal - aVal;
                    }
                    
                    const aStr = String(aVal || '').toLowerCase();
                    const bStr = String(bVal || '').toLowerCase();
                    
                    if (sortConfig.direction === 'asc') {
                        return aStr < bStr ? -1 : aStr > bStr ? 1 : 0;
                    } else {
                        return aStr > bStr ? -1 : aStr < bStr ? 1 : 0;
                    }
                });
            }

            document.getElementById('resultCount').textContent = 
                'Showing ' + filteredData.length.toLocaleString() + ' of ' + allData.length.toLocaleString() + ' results';

            const tbody = document.getElementById('tableBody');
            const noResults = document.getElementById('noResults');

            if (filteredData.length === 0) {
                tbody.innerHTML = '';
                noResults.classList.remove('hidden');
            } else {
                noResults.classList.add('hidden');
                const displayData = filteredData.slice(0, 1000);
                tbody.innerHTML = displayData.map(row =>
                    '<tr class="hover:bg-gray-50">' +
                    columns.map(col => {
                        const val = row[col];
                        const display = formatValue(val, col);
                        return '<td class="px-4 py-3 text-sm text-gray-700 whitespace-nowrap">' + display + '</td>';
                    }).join('') +
                    '</tr>'
                ).join('');
                
                console.log('Table rendered with', displayData.length, 'rows');
            }
        }

        function clearFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('weekFilter').value = '';
            document.getElementById('gameFilter').value = '';
            document.getElementById('percentileFilter').value = '';
            document.getElementById('duplicatesFilter').value = '';
            document.getElementById('rosterFilter').value = '';
            document.getElementById('cptFilter').value = '';
            document.getElementById('spreadFilter').value = '';
            document.getElementById('totalFilter').value = '';
            document.getElementById('marginFilter').value = '';
            renderTable();
            
            // Hide analytics results when filters are cleared
            document.getElementById('analyticsResults').style.display = 'none';
        }

        function toggleAnalytics() {
            const content = document.getElementById('analyticsContent');
            const icon = document.querySelector('.toggle-icon');
            
            content.classList.toggle('expanded');
            icon.classList.toggle('expanded');
        }

        function analyzeFiltered() {
            if (filteredData.length === 0) {
                alert('No data to analyze. Please adjust your filters.');
                return;
            }

            const results = document.getElementById('analyticsResults');
            results.style.display = 'block';

            // Find Duplicates column
            const duplicatesCol = columns.find(col => 
                col === 'Duplicates' || 
                col === 'duplicates' ||
                col.toLowerCase() === 'duplicates'
            );

            // Calculate total weighted entries (sum of all duplicates)
            const totalWeightedEntries = filteredData.reduce((sum, row) => {
                const duplicates = duplicatesCol ? (Number(row[duplicatesCol]) || 1) : 1;
                return sum + duplicates;
            }, 0);

            // Sample size
            document.getElementById('sampleSize').textContent = 
                `Analyzing ${filteredData.length.toLocaleString()} unique lineups (${totalWeightedEntries.toLocaleString()} total entries) of ${allData.length.toLocaleString()} unique lineups in database`;

            // Roster construction breakdown - weighted by duplicates
            const rosterCounts = {};
            filteredData.forEach(row => {
                const roster = row['Roster_Construction'];
                const duplicates = duplicatesCol ? (Number(row[duplicatesCol]) || 1) : 1;
                if (roster) {
                    rosterCounts[roster] = (rosterCounts[roster] || 0) + duplicates;
                }
            });

            const rosterBreakdown = document.getElementById('rosterBreakdown');
            rosterBreakdown.innerHTML = Object.entries(rosterCounts)
                .sort((a, b) => b[1] - a[1]) // Sort by count descending
                .map(([type, count]) => {
                    const percentage = (count / totalWeightedEntries * 100).toFixed(1);
                    return `
                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <span class="font-semibold text-gray-700">${type}</span>
                                <span class="text-sm text-gray-600">${count.toLocaleString()} (${percentage}%)</span>
                            </div>
                            <div class="roster-bar">
                                <div class="roster-bar-fill" style="width: ${percentage}%"></div>
                            </div>
                        </div>
                    `;
                })
                .join('');

            // CPT Position breakdown - weighted by duplicates
            const cptCounts = {};
            filteredData.forEach(row => {
                const cpt = row['CPT_Position_Vegas'] || row['CPT_Position'];
                const duplicates = duplicatesCol ? (Number(row[duplicatesCol]) || 1) : 1;
                if (cpt) {
                    cptCounts[cpt] = (cptCounts[cpt] || 0) + duplicates;
                }
            });

            const cptBreakdown = document.getElementById('cptBreakdown');
            cptBreakdown.innerHTML = Object.entries(cptCounts)
                .sort((a, b) => b[1] - a[1]) // Sort by count descending
                .map(([type, count]) => {
                    const percentage = (count / totalWeightedEntries * 100).toFixed(1);
                    return `
                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <span class="font-semibold text-gray-700">${type}</span>
                                <span class="text-sm text-gray-600">${count.toLocaleString()} (${percentage}%)</span>
                            </div>
                            <div class="roster-bar">
                                <div class="roster-bar-fill" style="width: ${percentage}%"></div>
                            </div>
                        </div>
                    `;
                })
                .join('');

            // Average Salary Used - weighted by duplicates
            const salaryColumn = columns.find(col => 
                col === 'Total Salary Used' || 
                col === 'Total_Salary_Used' ||
                col.replace(/ /g, '_') === 'Total_Salary_Used' ||
                col.replace(/_/g, ' ') === 'Total Salary Used'
            );
            
            if (salaryColumn) {
                const totalWeightedSalary = filteredData.reduce((sum, row) => {
                    const salary = Number(row[salaryColumn]) || 0;
                    const duplicates = duplicatesCol ? (Number(row[duplicatesCol]) || 1) : 1;
                    return sum + (salary * duplicates);
                }, 0);
                const avgSalary = totalWeightedSalary / totalWeightedEntries;
                document.getElementById('avgSalary').textContent = 
                    '$' + Math.round(avgSalary).toLocaleString();
            } else {
                console.log('Available columns:', columns);
                console.log('Looking for salary column, found:', salaryColumn);
                document.getElementById('avgSalary').textContent = 'N/A';
            }

            // Calculate average position counts by favorite/underdog - weighted by duplicates
            const countQBFav = columns.find(col => col === 'Count_QB_Favorite');
            const countQBDog = columns.find(col => col === 'Count_QB_Underdog');
            const countRBFav = columns.find(col => col === 'Count_RB_Favorite');
            const countRBDog = columns.find(col => col === 'Count_RB_Underdog');
            const countWRFav = columns.find(col => col === 'Count_WR_Favorite');
            const countWRDog = columns.find(col => col === 'Count_WR_Underdog');
            const countTEFav = columns.find(col => col === 'Count_TE_Favorite');
            const countTEDog = columns.find(col => col === 'Count_TE_Underdog');
            const countKFav = columns.find(col => col === 'Count_K_Favorite');
            const countKDog = columns.find(col => col === 'Count_K_Underdog');
            const countDSTFav = columns.find(col => col === 'Count_DST_Favorite');
            const countDSTDog = columns.find(col => col === 'Count_DST_Underdog');

            // Debug logging
            console.log('Position count columns found:', {
                countQBFav, countQBDog, countRBFav, countRBDog, 
                countWRFav, countWRDog, countTEFav, countTEDog,
                countKFav, countKDog, countDSTFav, countDSTDog
            });

            let qbFavTotal = 0, qbDogTotal = 0;
            let rbFavTotal = 0, rbDogTotal = 0;
            let wrFavTotal = 0, wrDogTotal = 0;
            let teFavTotal = 0, teDogTotal = 0;
            let kFavTotal = 0, kDogTotal = 0;
            let dstFavTotal = 0, dstDogTotal = 0;

            filteredData.forEach(row => {
                const duplicates = duplicatesCol ? (Number(row[duplicatesCol]) || 1) : 1;
                
                if (countQBFav) qbFavTotal += (Number(row[countQBFav]) || 0) * duplicates;
                if (countQBDog) qbDogTotal += (Number(row[countQBDog]) || 0) * duplicates;
                if (countRBFav) rbFavTotal += (Number(row[countRBFav]) || 0) * duplicates;
                if (countRBDog) rbDogTotal += (Number(row[countRBDog]) || 0) * duplicates;
                if (countWRFav) wrFavTotal += (Number(row[countWRFav]) || 0) * duplicates;
                if (countWRDog) wrDogTotal += (Number(row[countWRDog]) || 0) * duplicates;
                if (countTEFav) teFavTotal += (Number(row[countTEFav]) || 0) * duplicates;
                if (countTEDog) teDogTotal += (Number(row[countTEDog]) || 0) * duplicates;
                if (countKFav) kFavTotal += (Number(row[countKFav]) || 0) * duplicates;
                if (countKDog) kDogTotal += (Number(row[countKDog]) || 0) * duplicates;
                if (countDSTFav) dstFavTotal += (Number(row[countDSTFav]) || 0) * duplicates;
                if (countDSTDog) dstDogTotal += (Number(row[countDSTDog]) || 0) * duplicates;
            });

            const avgQBFav = (qbFavTotal / totalWeightedEntries).toFixed(2);
            const avgQBDog = (qbDogTotal / totalWeightedEntries).toFixed(2);
            const avgRBFav = (rbFavTotal / totalWeightedEntries).toFixed(2);
            const avgRBDog = (rbDogTotal / totalWeightedEntries).toFixed(2);
            const avgWRFav = (wrFavTotal / totalWeightedEntries).toFixed(2);
            const avgWRDog = (wrDogTotal / totalWeightedEntries).toFixed(2);
            const avgTEFav = (teFavTotal / totalWeightedEntries).toFixed(2);
            const avgTEDog = (teDogTotal / totalWeightedEntries).toFixed(2);
            const avgKFav = (kFavTotal / totalWeightedEntries).toFixed(2);
            const avgKDog = (kDogTotal / totalWeightedEntries).toFixed(2);
            const avgDSTFav = (dstFavTotal / totalWeightedEntries).toFixed(2);
            const avgDSTDog = (dstDogTotal / totalWeightedEntries).toFixed(2);

            document.getElementById('positionOwnership').innerHTML = `
                <div class="flex justify-between items-center bg-gray-50 p-2 rounded">
                    <span class="font-semibold text-gray-700">QB Fav</span>
                    <span class="text-lg font-bold" style="color: #000000;">${avgQBFav}</span>
                </div>
                <div class="flex justify-between items-center bg-gray-50 p-2 rounded">
                    <span class="font-semibold text-gray-700">QB Dog</span>
                    <span class="text-lg font-bold" style="color: #000000;">${avgQBDog}</span>
                </div>
                <div class="flex justify-between items-center bg-gray-50 p-2 rounded">
                    <span class="font-semibold text-gray-700">RB Fav</span>
                    <span class="text-lg font-bold" style="color: #000000;">${avgRBFav}</span>
                </div>
                <div class="flex justify-between items-center bg-gray-50 p-2 rounded">
                    <span class="font-semibold text-gray-700">RB Dog</span>
                    <span class="text-lg font-bold" style="color: #000000;">${avgRBDog}</span>
                </div>
                <div class="flex justify-between items-center bg-gray-50 p-2 rounded">
                    <span class="font-semibold text-gray-700">WR Fav</span>
                    <span class="text-lg font-bold" style="color: #000000;">${avgWRFav}</span>
                </div>
                <div class="flex justify-between items-center bg-gray-50 p-2 rounded">
                    <span class="font-semibold text-gray-700">WR Dog</span>
                    <span class="text-lg font-bold" style="color: #000000;">${avgWRDog}</span>
                </div>
                <div class="flex justify-between items-center bg-gray-50 p-2 rounded">
                    <span class="font-semibold text-gray-700">TE Fav</span>
                    <span class="text-lg font-bold" style="color: #000000;">${avgTEFav}</span>
                </div>
                <div class="flex justify-between items-center bg-gray-50 p-2 rounded">
                    <span class="font-semibold text-gray-700">TE Dog</span>
                    <span class="text-lg font-bold" style="color: #000000;">${avgTEDog}</span>
                </div>
                <div class="flex justify-between items-center bg-gray-50 p-2 rounded">
                    <span class="font-semibold text-gray-700">K Fav</span>
                    <span class="text-lg font-bold" style="color: #000000;">${avgKFav}</span>
                </div>
                <div class="flex justify-between items-center bg-gray-50 p-2 rounded">
                    <span class="font-semibold text-gray-700">K Dog</span>
                    <span class="text-lg font-bold" style="color: #000000;">${avgKDog}</span>
                </div>
                <div class="flex justify-between items-center bg-gray-50 p-2 rounded">
                    <span class="font-semibold text-gray-700">DST Fav</span>
                    <span class="text-lg font-bold" style="color: #000000;">${avgDSTFav}</span>
                </div>
                <div class="flex justify-between items-center bg-gray-50 p-2 rounded">
                    <span class="font-semibold text-gray-700">DST Dog</span>
                    <span class="text-lg font-bold" style="color: #000000;">${avgDSTDog}</span>
                </div>
            `;

            // Average cumulative ownership - weighted by duplicates
            const cumulativeOwnCol = columns.find(col => 
                col === 'Cumulative Ownership' || 
                col === 'Cumulative_Ownership' ||
                col.replace(/ /g, '_') === 'Cumulative_Ownership' ||
                col.replace(/_/g, ' ') === 'Cumulative Ownership'
            );
            
            if (cumulativeOwnCol) {
                const totalWeightedOwn = filteredData.reduce((sum, row) => {
                    const own = Number(row[cumulativeOwnCol]) || 0;
                    const duplicates = duplicatesCol ? (Number(row[duplicatesCol]) || 1) : 1;
                    return sum + (own * duplicates);
                }, 0);
                const avgOwn = (totalWeightedOwn / totalWeightedEntries) * 100;
                document.getElementById('avgOwnership').textContent = avgOwn.toFixed(2) + '%';
            } else {
                console.log('Looking for cumulative ownership column, found:', cumulativeOwnCol);
                document.getElementById('avgOwnership').textContent = 'N/A';
            }
        }

        loadData();
    </script>
</body>
</html>
